# CasaOS App Store manifest for KinetiRx (Pharma Care Pro) — x-casaos v2
# compose-extension spec: a normal docker-compose file plus a top-level
# `x-casaos` key (and small per-service `x-casaos` blocks) that the CasaOS
# UI reads to render the app store listing, icon, and one-click install.
#
# WHY A SEPARATE FILE (not `x-casaos:` appended onto deploy/docker-compose.yml):
#   1. CasaOS installs apps by pulling published container IMAGES — it does
#      not build from a source tree on the NAS the way `docker compose
#      --build` does in deploy/docker-compose.yml (which assumes the repo
#      checkout is present locally, e.g. for a VPS deploy). The two files
#      necessarily diverge on `build:` vs `image:`, so keeping them separate
#      avoids a single file trying to serve both purposes.
#   2. CasaOS's schema is strict about the top-level `x-casaos` shape;
#      keeping it isolated means a schema quirk/CasaOS store review
#      requirement never risks breaking the plain Compose deployment path.
#
# BEFORE REAL SUBMISSION: build and push the two images referenced below to
# a registry (e.g. `ghcr.io/raktim94/kinetirx-backend:latest` and
# `ghcr.io/raktim94/kinetirx-frontend:latest` — build with
# `docker build -t <tag> -f backend/Dockerfile backend` and the frontend
# equivalent, then `docker push`). This manifest is otherwise complete and
# ready to submit to the CasaOS AppStore repo once those images exist.

name: kinetirx

services:
  kinetirx-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kinetirx
      POSTGRES_PASSWORD: $AppID_PASSWORD
      POSTGRES_DB: kinetirx
    volumes:
      - /DATA/AppData/$AppID/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinetirx -d kinetirx"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - kinetirx_net
    x-casaos:
      envs:
        - container: POSTGRES_PASSWORD
          description:
            en_us: Auto-generated database password (do not change after first install).

  kinetirx-backend:
    # Replace with your published image before submitting to the CasaOS
    # AppStore — see the file-level comment above.
    image: ghcr.io/raktim94/kinetirx-backend:latest
    restart: unless-stopped
    depends_on:
      kinetirx-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://kinetirx:$AppID_PASSWORD@kinetirx-postgres:5432/kinetirx?sslmode=disable
      JWT_SECRET: $AppID_JWT_SECRET
      KINETIRX_ADMIN_PASSWORD: $AppID_ADMIN_PASSWORD
      GEMINI_API_KEY: ""
      PORT: "8080"
      GIN_MODE: release
      ALLOWED_ORIGINS: http://localhost:$PORT
    volumes: []
    networks:
      - kinetirx_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    x-casaos:
      envs:
        - container: JWT_SECRET
          description:
            en_us: Auto-generated JWT signing secret (do not change after first install — invalidates all active sessions).
        - container: KINETIRX_ADMIN_PASSWORD
          description:
            en_us: Password for the seeded Master Admin account (id EMP-ADMIN-1). Only used on first boot.
        - container: GEMINI_API_KEY
          description:
            en_us: Optional — enables AI-powered OCR bill scanning and the clinical AI assistant. Leave blank to run those features in offline/fallback mode.

  kinetirx-frontend:
    # Replace with your published image before submitting to the CasaOS
    # AppStore — see the file-level comment above.
    image: ghcr.io/raktim94/kinetirx-frontend:latest
    restart: unless-stopped
    depends_on:
      kinetirx-backend:
        condition: service_healthy
    ports:
      - target: 80
        published: $PORT
        protocol: tcp
    networks:
      - kinetirx_net
    x-casaos:
      ports:
        - container: "80"
          description:
            en_us: Web UI port.

networks:
  kinetirx_net:
    driver: bridge

x-casaos:
  architectures:
    - amd64
    - arm64
  main: kinetirx-frontend
  category: Productivity
  author: Raktim94
  developer: Raktim94
  icon: https://raw.githubusercontent.com/Raktim94/KinetiRx/main/deploy/icon.png
  screenshot_link:
    - https://raw.githubusercontent.com/Raktim94/KinetiRx/main/deploy/screenshots/dashboard.png
    - https://raw.githubusercontent.com/Raktim94/KinetiRx/main/deploy/screenshots/pos.png
    - https://raw.githubusercontent.com/Raktim94/KinetiRx/main/deploy/screenshots/inventory.png
    - https://raw.githubusercontent.com/Raktim94/KinetiRx/main/deploy/screenshots/patients.png
  thumbnail: https://raw.githubusercontent.com/Raktim94/KinetiRx/main/deploy/thumbnail.png
  title:
    en_us: KinetiRx
  tagline:
    en_us: Pharmacy & clinic management — POS, inventory, patients, and daily accounts in one app.
  description:
    en_us: >-
      KinetiRx (Pharma Care Pro) is a self-hosted pharmacy and small-clinic
      management system: point-of-sale billing with GST invoicing, medicine
      inventory and distributor tracking, patient records and due-khata
      (credit ledger), OPD visit scheduling, daily sales/cash-drawer
      reconciliation, expense tracking, doctor outreach campaigns, and
      role-based employee accounts — all backed by your own Postgres
      database running on this device, with no third-party SaaS dependency
      for core operations. Optional Gemini AI integration adds purchase-bill
      OCR scanning and a clinical assistant when a Gemini API key is
      supplied.
  tips:
    before_install:
      en_us: >-
        On first boot the app seeds one administrator account (ID
        EMP-ADMIN-1) using the admin password you set below — save it
        somewhere safe, there is no password-reset flow yet.
  index: /
  port_map: "3080"
  scheme: http
