# Serves the built React SPA and reverse-proxies /api/* to the backend
# container, so the browser only ever talks to one origin (this container)
# and never hits CORS at all in the Docker Compose deployment.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Reverse proxy API calls to the backend service (Compose DNS name
    # "backend", see deploy/docker-compose.yml). changeOrigin isn't needed
    # server-side the way it is for a JS dev proxy; Host is forwarded as-is.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The backend's write timeout is 60s (generous for the Gemini
        # OCR/AI round-trip) — match that here so nginx doesn't cut the
        # connection first.
        proxy_read_timeout 65s;
    }

    # SPA fallback: any non-file, non-/api request serves index.html so
    # client-side routing (if/when added) doesn't 404 on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache immutable hashed build assets.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
