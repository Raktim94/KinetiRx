SHORTDESC='Free self-hosted pharmacy and small-clinic management (runs in Docker)'
LONGDESC=' KinetiRx is a free, open-source pharmacy and clinic system: billing, batch
 and expiry stock, patient records, dues and OPD scheduling. This package
 installs a systemd service that runs the published, version-pinned KinetiRx
 containers and a PostgreSQL database with Docker Compose, keeping all data in a
 Docker volume on this machine. Open http://localhost:3080 after installing.
 .
 Settings are in /etc/kinetirx/kinetirx.env. Upgrade with apt; back up your data
 first.'
